baseURL = 'https://brian936826-lang.github.io/'
languageCode = 'zh-CN'
defaultContentLanguage = 'zh'
hasCJKLanguage = true
title = 'Brian'
theme = 'PaperMod'

[params]
  author = 'Brian'
  description = '个人网站：阅读、思考、作品。'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  mainSections = ['posts']

  [params.profileMode]
    enabled = true
    title = 'Brian'
    subtitle = '读与写'
    imageUrl = '/images/avatar.jpg'
    imageTitle = 'Brian'
    imageWidth = 150
    imageHeight = 150

    [[params.profileMode.buttons]]
      name = '文章'
      url = '/posts/'
    [[params.profileMode.buttons]]
      name = '作品'
      url = '/projects/'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/brian936826-lang'
  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:brian936826@gmail.com'

[[menu.main]]
  name = '首页'
  url = '/'
  weight = 1
